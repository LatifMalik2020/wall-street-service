name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          # Pinned: unpinned ruff/black drifted (ruff 0.16 default-rule change,
          # black yearly style) and turned CI red with no code change. Bump deliberately.
          pip install ruff==0.17.5 black==26.10.1
          ruff check src/
          black --check src/

      - name: Run type checking
        # Advisory only: mypy has ~186 pre-existing findings in 24 files and has
        # never been green; keep the signal without blocking test/build.
        continue-on-error: true
        run: |
          pip install mypy==2.4.1 "boto3-stubs[dynamodb,events]"
          mypy src/ --ignore-missing-imports

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio pytest-cov moto
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: wall-street-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
